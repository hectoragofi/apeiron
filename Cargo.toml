[package]
name = "apeiron"
version = "0.4.1"
edition = "2021"
description = "Apeiron: an infinite-canvas window manager for Windows"
license = "MIT"

[dependencies]
async-channel = "2"
gpui = "0.2.2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.25", default-features = false }
windows-registry = "0.6"

[dependencies.image]
version = "0.25"
default-features = false
features = ["bmp", "jpeg", "png"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
opt-level = 1

# GPUI lays out and paints every frame; unoptimized dependencies make debug
# runs unusable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
