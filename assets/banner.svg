<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#3a3f55"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0d0f17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0f17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cf6"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#0d0f17"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <g fill="#161a26" stroke="#2c3247" stroke-width="1.5">
    <rect x="70" y="60" width="210" height="140" rx="10"/>
    <rect x="130" y="250" width="160" height="100" rx="10" opacity=".7"/>
    <rect x="900" y="50" width="240" height="150" rx="10"/>
    <rect x="960" y="245" width="170" height="110" rx="10" opacity=".7"/>
    <rect x="320" y="290" width="120" height="80" rx="8" opacity=".45"/>
    <rect x="770" y="285" width="130" height="85" rx="8" opacity=".45"/>
  </g>
  <g fill="#2c3247">
    <rect x="70" y="60" width="210" height="18" rx="9"/>
    <rect x="900" y="50" width="240" height="18" rx="9"/>
  </g>
  <rect width="1200" height="400" fill="url(#fade)"/>
  <text x="600" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="url(#glow)" letter-spacing="6">ἄπειρον</text>
  <text x="600" y="258" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9aa3bd" letter-spacing="8">YOUR DESKTOP, WITHOUT EDGES</text>
</svg>
